# Geliştirme için veritabanı ve Redis:  npm run db:up  /  npm run db:down
# Uygulamalar (API, panel, mini uygulama) bilgisayarda `npm run dev` ile çalışır.
name: vado-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vado
      POSTGRES_DB: vado
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vado"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tek API süreciyle çalışırken gerekmez; REDIS_URL tanımlanırsa kullanılır.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
