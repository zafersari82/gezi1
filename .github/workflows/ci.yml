# Her itme ve birleştirme isteğinde tüm denetimleri çalıştırır: biçim, lint, proje kuralları,
# tip denetimi, testler (gerçek PostgreSQL üzerinde) ve derlemeler.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vado
          POSTGRES_DB: vado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vado"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_TEST_ADMIN_URL: postgres://postgres:vado@localhost:5432/postgres
      DATABASE_URL: postgres://vado_app:vado@localhost:5432/vado
      DATABASE_MIGRATE_URL: postgres://vado_owner:vado@localhost:5432/vado
      DATABASE_PLATFORM_URL: postgres://vado_platform:vado@localhost:5432/vado
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier farkını göster
        run: |
          cp docs/PLAN_2.8.md /tmp/PLAN_2.8.md
          cp apps/api/test/restaurant-isolation.test.ts /tmp/restaurant-isolation.test.ts
          npx prettier --write docs/PLAN_2.8.md apps/api/test/restaurant-isolation.test.ts
          git diff -- docs/PLAN_2.8.md apps/api/test/restaurant-isolation.test.ts
          cmp -s /tmp/PLAN_2.8.md docs/PLAN_2.8.md && cmp -s /tmp/restaurant-isolation.test.ts apps/api/test/restaurant-isolation.test.ts
      - run: npm run check
