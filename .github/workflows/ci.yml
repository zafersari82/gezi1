# Her itme ve birleştirme isteğinde tüm denetimleri çalıştırır: biçim, lint, proje kuralları,
# tip denetimi, testler (gerçek PostgreSQL üzerinde) ve derlemeler.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vado
          POSTGRES_PASSWORD: vado
          POSTGRES_DB: vado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vado -d vado"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://vado:vado@localhost:5432/vado
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
