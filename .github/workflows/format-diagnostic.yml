name: Format diagnostic

on:
  push:
    branches: [main]

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write apps/api/src/cli/import-locations.ts apps/api/src/modules/location/location.service.ts apps/api/test/location.test.ts packages/contracts/src/location.ts
          git diff -- apps/api/src/cli/import-locations.ts apps/api/src/modules/location/location.service.ts apps/api/test/location.test.ts packages/contracts/src/location.ts
